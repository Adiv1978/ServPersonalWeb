<div class="container-fluid py-3">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 mb-0 text-gray-800">
      {{ esEdicion ? 'Editar Empleado' : 'Nuevo Empleado' }}
    </h2>
    <a routerLink="/home/personal" class="btn btn-outline-secondary shadow-sm">
      Volver al Listado
    </a>
  </div>

  <div class="card shadow mb-4" style="max-width: 800px; margin: 0 auto;">
    <div class="card-body p-4">

      <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>
      <div class="alert alert-success" *ngIf="mensajeExito">{{ mensajeExito }}</div>

      <div class="text-center py-4" *ngIf="cargando && esEdicion && personalForm.pristine">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando datos...</span>
        </div>
      </div>

      <form [formGroup]="personalForm" (ngSubmit)="guardar()" *ngIf="!(cargando && esEdicion && personalForm.pristine)">
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="cedula" class="form-label fw-medium">Cédula</label>
            <input type="text" id="cedula" class="form-control" formControlName="cedula" 
                   [ngClass]="{'is-invalid': personalForm.get('cedula')?.invalid && personalForm.get('cedula')?.touched}">
            <div class="invalid-feedback">La cédula es requerida.</div>
          </div>
          
          <div class="col-md-6 mt-3 mt-md-0">
            <label for="puestoTrabajo" class="form-label fw-medium">Puesto de Trabajo</label>
            <input type="text" id="puestoTrabajo" class="form-control" formControlName="puestoTrabajo"
                   [ngClass]="{'is-invalid': personalForm.get('puestoTrabajo')?.invalid && personalForm.get('puestoTrabajo')?.touched}">
            <div class="invalid-feedback">El puesto de trabajo es requerido.</div>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label for="nombre" class="form-label fw-medium">Nombre</label>
            <input type="text" id="nombre" class="form-control" formControlName="nombre"
                   [ngClass]="{'is-invalid': personalForm.get('nombre')?.invalid && personalForm.get('nombre')?.touched}">
            <div class="invalid-feedback">El nombre es requerido.</div>
          </div>

          <div class="col-md-6 mt-3 mt-md-0">
            <label for="apellidos" class="form-label fw-medium">Apellidos</label>
            <input type="text" id="apellidos" class="form-control" formControlName="apellidos"
                   [ngClass]="{'is-invalid': personalForm.get('apellidos')?.invalid && personalForm.get('apellidos')?.touched}">
            <div class="invalid-feedback">Los apellidos son requeridos.</div>
          </div>
        </div>

        <hr class="mt-4 mb-4">
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-light" routerLink="/home/personal" [disabled]="cargando">Cancelar</button>
          <button type="submit" class="btn btn-primary px-4" [disabled]="cargando">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            {{ esEdicion ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
